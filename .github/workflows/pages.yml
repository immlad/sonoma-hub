name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Sonoma Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Sonoma Hub
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: "1"

      - name: Check build output
        run: |
          echo "=== Build directories ==="
          find . -maxdepth 3 -type d \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | sort

          echo ""
          echo "=== HTML files ==="
          find . \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -name "*.html" \
            -print

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          if [ -d ".output/public" ]; then
            echo "Using TanStack Start output: .output/public"
            OUTPUT_DIR=".output/public"

          elif [ -d "dist/client" ]; then
            echo "Using client output: dist/client"
            OUTPUT_DIR="dist/client"

          elif [ -d "dist" ]; then
            echo "Using Vite output: dist"
            OUTPUT_DIR="dist"

          else
            echo "ERROR: No static build directory found."
            exit 1
          fi

          echo "Output directory: $OUTPUT_DIR"

          if [ ! -f "$OUTPUT_DIR/index.html" ]; then
            echo "ERROR: $OUTPUT_DIR/index.html does not exist."
            find "$OUTPUT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          cp "$OUTPUT_DIR/index.html" "$OUTPUT_DIR/404.html"

          touch "$OUTPUT_DIR/.nojekyll"

          echo "Pages files prepared:"
          find "$OUTPUT_DIR" -maxdepth 2 -type f | sort | head -100

          echo "OUTPUT_DIR=$OUTPUT_DIR" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.OUTPUT_DIR }}

  deploy:
    name: Deploy Sonoma Hub
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
