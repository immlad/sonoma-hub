name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build static site
        run: bun run build
        env:
          GITHUB_PAGES: "1"
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Find output
        id: out
        run: |
          DIR=$(dirname "$(find . -path ./node_modules -prune -o -name index.html -path '*client*' -print | head -1)")
          [ -z "$DIR" ] || [ "$DIR" = "." ] && DIR=dist/client
          cp "$DIR/index.html" "$DIR/404.html"
          touch "$DIR/.nojekyll"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
