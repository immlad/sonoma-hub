name: Deploy Sonoma Hub to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Sonoma Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production
          GITHUB_PAGES: "1"

      - name: Prepare Pages artifact
        id: prepare_pages
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for generated index.html files..."

          find . \
            -type f \
            -name "index.html" \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            -print | sort

          OUTPUT_DIR=""

          for DIR in ".output/public" "dist/client" "dist"; do
            if [ -f "$DIR/index.html" ]; then
              OUTPUT_DIR="$DIR"
              break
            fi
          done

          if [ -z "$OUTPUT_DIR" ]; then
            echo "::error::Could not find index.html in a supported output directory."

            echo "Generated HTML files:"
            find . \
              -type f \
              -name "*.html" \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" \
              -print | sort

            echo "Generated directories:"
            find . \
              -maxdepth 4 \
              -type d \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" \
              -print | sort

            exit 1
          fi

          if [ ! -s "$OUTPUT_DIR/index.html" ]; then
            echo "::error::index.html is missing or empty."
            exit 1
          fi

          echo "Using output directory: $OUTPUT_DIR"

          if [ ! -f "$OUTPUT_DIR/404.html" ]; then
            cp "$OUTPUT_DIR/index.html" "$OUTPUT_DIR/404.html"
          fi

          touch "$OUTPUT_DIR/.nojekyll"

          echo "Published files:"
          ls -la "$OUTPUT_DIR" | head -100

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.prepare_pages.outputs.output_dir }}

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4